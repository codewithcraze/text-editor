<!DOCTYPE html>
<html lang="en">

<head>
    <title>Documentation - Travelport GDS Integration</title>
    <!-- Meta -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bootstrap Documentation Template For Software Developers">
    <meta name="author" content="Xiaoying Riley at 3rd Wave Media">
    <link rel="shortcut icon" href="favicon.ico">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="/main.css" rel="stylesheet" type="text/css" />
</head>

<body class="container mt-3">
    <h1>My Snaap.io  Editor</h1>
    <!-- Toolbar -->
    <div class="toolbar relative">
        <select id="headingSelector">
            <option value="">Select Heading</option>
            <option value="h1">Heading 1</option>
            <option value="h2">Heading 2</option>
            <option value="h3">Heading 3</option>
            <option value="h4">Heading 4</option>
            <option value="h5">Heading 5</option>
            <option value="h6">Heading 6</option>
            <option value="p">Paragraph</option>
        </select>
        <button onclick="formatText('bold')">B</button>
        <button onclick="formatText('italic')">I</button>
        <button onclick="formatText('underline')">U</button>
        <button onclick="insertLink()"><i class="fa-solid fa-link"></i></button>
        <button onclick="blockquoteText('blockquote')"> <i class="fas fa-quote-left"></i></button>
        <button onclick="applyList('unordered')"><i class="fa-solid fa-list-ul"></i></button>
        <button onclick="applyList('ordered')"><i class="fa-solid fa-list-ol"></i></button>

        <div class="set-table" onmouseover="showTableOptions()" onmouseout="hideTableOptions()">
            <button class="table-button"><i class="fa-solid fa-table"></i></button>
            <div class="table-options d-none" id="table-options">

            </div>
        </div>
        <!-- <button onclick="insertTable(3, 3)">Insert 3x3 Table</button>
        <button onclick="insertTable(4, 4)">Insert 4x4 Table</button> -->
        <div class="align" onmouseover="showAlignmentOptions()" onmouseout="hideAlignmentOptions()">
            <button class="alignment"><i class="fa-solid fa-a"></i></button>
            <div id="alignment-options" class="d-none alignment-options">
                <button data-align="alignLeft" onclick="alignText('justifyLeft')"><i
                        class="fa-solid fa-align-left"></i></button>
                <button data-align="alignRight" onclick="alignText('justifyRight')"><i
                        class="fa-solid fa-align-right"></i></button>
                <button data-align="alignJustify" onclick="alignText('justifyFull')"><i
                        class="fa-solid fa-align-justify"></i></button>
            </div>
        </div>
        <button onclick="downloadEditorContent()"><i class="fa-solid fa-download"></i></button>

        <div class="set-imageUpload" onmouseover="showImageUploadFeature()" onmouseout="hideImageUploadFeature()">
            <button class="upload">
                <i class="fa-solid fa-image"></i>
            </button>
            <div id="upload-options" class="d-none upload-options pt-2">
                <div class="d-flex mb-1">
                    <input type="number" placeholder="width" id="width" class="image-input" />
                    <input type="number" placeholder="height" id="height" class="image-input" />
                </div>
                <input type="file" placeholder="Select Image to upload" id="file" style="width: 200px; border: 1px solid rgb(164, 164, 164)" />
                <button type="button" class="btn btn-primary">
                    Upload Image
                </button>
            </div>

        </div>
    </div>
    <!-- Editor -->
    <div class="dk-editor">
        <div class="editor" id="editor" contenteditable="true">
        </div>
        <span class="powered">Powered by Snaap.io</span>

    </div>
    <script src="./main.js"></script>
    <!-- and it's easy to individually load additional languages -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
</body>

</html>
